<!doctype html>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#070e2c}
#app{position:relative;width:720px;height:1280px;font-family:'DejaVu Sans',sans-serif;color:#fff;overflow:hidden;
 background:radial-gradient(ellipse 75% 55% at 50% 22%,#182a66 0%,#101c4d 45%,#0a1236 75%,#070e2c 100%)}
#grid{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(110,140,255,.045) 1px,transparent 1px),linear-gradient(0deg,rgba(110,140,255,.045) 1px,transparent 1px);background-size:36px 36px}
#stage{position:absolute;inset:0}
.abs{position:absolute}
#hdr{position:absolute;left:34px;top:36px;font-size:19px;line-height:22px;color:#a7b4e6;font-family:'DejaVu Sans Mono',monospace;white-space:nowrap}
#cnt{position:absolute;right:34px;top:36px;font-size:19px;line-height:22px;color:#fbbf24;font-family:'DejaVu Sans Mono',monospace;text-align:right}
#prog{position:absolute;left:34px;right:34px;top:70px;height:4px;display:flex;gap:5px}
#prog i{flex:1;background:#2a3a85;border-radius:3px}
#ttl{position:absolute;left:20px;width:680px;top:104px;text-align:center;font-weight:700;font-size:49.4px;line-height:57px;letter-spacing:.5px;color:#fff;text-transform:uppercase}
#ttl b{display:block;color:#fbbf24}
#cap{position:absolute;left:50px;width:620px;top:984px;height:140px;text-align:center;font-weight:700;font-size:49.4px;line-height:59px;text-transform:uppercase;letter-spacing:.3px}
#cap span{display:inline-block;margin:0 .23em}
.card{background:linear-gradient(180deg,#17265f 0%,#132156 100%);border:1.5px solid #2d438c;border-radius:14px;box-shadow:0 6px 22px rgba(2,6,24,.35)}
.nt{background:#050922;border:1.5px solid #1e3170;border-radius:14px;font-family:'DejaVu Sans Mono',monospace;white-space:pre;box-shadow:0 6px 22px rgba(2,6,24,.35)}
</style>
<div id="app"><div id="grid"></div><div id="stage"></div>
<div id="hdr">{{HEADER}}</div><div id="cnt"></div><div id="prog"></div><div id="ttl"></div>
<div id="cap"></div></div>
